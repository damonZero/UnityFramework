    <script>
        var CSLibrary = new CSInterface();
        /**
         * This function will be called when PP's theme color been changed and it will change
         * extension's background color according to PP's.
         **/


        function fxWin() {
            window.resizeTo(800, 600);
        }
        window.onload = fxWin;
        window.onresize = fxWin;

        window.addEventListener('mousewheel', function(event){
        if (event.ctrlKey === true || event.metaKey) {
            event.preventDefault();
        }
        },{ passive: false});

        window.addEventListener('DOMMouseScroll', function(event){

            }

        function themeChangedEventListener(event) {

        }

        function changeThemeColor() {
        }

        function test() {
            alert("ficl")
        }

        function search() {
            updateThumbnail();
        }

        var newPsd = function () {
            CSLibrary.evalScript(`newPsdHandler()`);
        }

        var openPsd = function (path) {
            CSLibrary.evalScript(`openPsdHandler("${path}")`);
        }

        var addPsd = function (params) {
            CSLibrary.evalScript(`addPsdHandler("${params}")`);
            updateThumbnail();
        }

        var addJsonCfg = function (isRepalce, popupIndex) {
            reset();
            CSLibrary.evalScript(`getCurLayersInfo("${getCfgPath()}")`, function (jsonInfo) {
                if (!jsonInfo || !decodeURI(jsonInfo)) {
                    alert('获取图层信息失败，请检查是否选中了正确的组件图层');
                    return;
                }
                var decoded = decodeURI(jsonInfo);
                var tags = '';
                if (isRepalce) {
                    tags = $('#modifyTags').val().trim();
                } else {
                    tags = $('#inputTags').val().trim();
                }

                // 批量新增：PS 端返回多行（~ 分隔），每行 psdPath@layerName@thumbnailPath
                if (decoded.indexOf('~') >= 0) {
                    var lines = decoded.split('~');
                    var items = [];
                    for (var i = 0; i < lines.length; i++) {
                        var info = lines[i].split('@');
                        var psdPath = info[0];
                        var layerName = info[1];
                        var thumbnailPath = info[2];
                        if (!psdPath || !layerName || !thumbnailPath) {
                            continue;
                        }
                        items.push({ psdPath: psdPath, layerName: layerName, thumbnailPath: thumbnailPath });
                    }
                    if (items.length == 0) {
                        alert('批量图层信息不完整，未添加任何组件');
                        return;
                    }
                    var count = addNewJsons(items, tags);
                    alert('批量新增完成：成功 ' + count + ' 个组件');
                    updateThumbnail();
                    if (!isRepalce && popupIndex !== undefined && popupIndex !== null) {
                        layer.close(popupIndex);
                    }
                    return;
                }

                // 单个新增
                var info = decoded.split('@')
                var psdPath = info[0];
                var layerName = info[1];
                var thumbnailPath = info[2];
                // 防御：evalScript 返回非预期内容(如错误信息)时，可能解析不出完整字段，直接拦截
                if (!psdPath || !layerName || !thumbnailPath) {
                    alert('图层信息不完整，无法添加公共组件。返回内容：' + decoded);
                    return;
                }
                var success = addNewJson(psdPath, layerName, thumbnailPath, tags);
                if (success) {
                    // 刷新组件列表，让新增的组件立即显示（无需手动刷新窗口）
                    updateThumbnail();
                    // 新增成功后自动关闭“新增公共组件配置”弹窗
                    if (!isRepalce && popupIndex !== undefined && popupIndex !== null) {
                        layer.close(popupIndex);
                    }
                }
            });
        }

        var reset = function () {

            $('#chooseThumbnail').empty();
        }

        var updateInputWidth = function () {
            $('.expandable input').each(function () {
                $(this).width((this.value.length + 1) * 14);
            })
        }

        var clearModifyInfo = function () {
            origModifyData = null;
            $('#showModifyName').text('');
            $('#modifyPsdPath').val('');
            $('#modifyThumbnail').val('');
            $('#modifyTags').val('');
            $('#modifyLayerName').val('');

        var initEvents = function () {

            $('#newContent').slideToggle(0);
            $('#modifyContent').slideToggle(0);

            $('#newBtn').click(function () {
                // $('#newContent').slideToggle(100, function () {
                //     if (!$(this).is(':visible')) {
                //         reset();

                // });
                onAddBtn();

            $('#modifyBtn').click(function () {
                // $('#modifyContent').slideToggle(100, function () {
                //     if (!$(this).is(':visible')) {
                //         clearModifyInfo();
                //     }

                // $('#modifyMore').slideToggle(0);
                onModifyBtn();

            $('#modifyMoreBtn').click(function () {
                $('#modifyMore').slideToggle(100);
            });

            $('.expandable input').on('input', function () {
                $(this).width((this.value.length + 1) * 14);
            })

            $('#inputThunmbnail').on('change', function (event) {
                const selectedFile = event.target.files[0];
                if (!selectedFile) {
                    $('#chooseThumbnail').empty();
                    return;
                }
                var realPath = selectedFile.path
                $('#inputThunmbnail').attr('data-url', realPath);
                showChooseThumbnail(realPath);
            });

            $('#slider').on('input', function () {
                UpdateThumbnailScale($(this).val());
            });

            $('#selectTag').change(function () {
                var selectedOption = $(this).children('option:selected').val();
                //alert('选中的选项值为：' + selectedOption);
                updateThumbnail()
            });

            // 获取该元素
            const dragAdd = $('.dragAdd');

            // 监听滚动事件
            $(window).scroll(function () {
                // 获取窗口的滚动距离
                const scrollDistance = $(window).scrollTop();
                if (scrollDistance > 200) {
                    // 如果是，则添加一个类名，使其样式更改为不在最上层
                    dragAdd.addClass('dragFloat');
                } else {
                    // 如果不是，则移除该类名，使其样式更改为在最上层
                    dragAdd.removeClass('dragFloat');
                }
            });

            CSLibrary.addEventListener("com.adobe.csxs.events.ThemeColorChanged", themeChangedEventListener);


            //initEvents(CSLibrary);
        }

        function onAddBtn() {
            //页面层-自定义
            var popupIndex = layer.open({
                type: 1,
                title: "新增公共组件配置",
                closeBtn: true,
                shift: 2,
                area: ['400px', '300px'],
                shadeClose: true,
                btn: ['新增', '重置'],
                btnAlign: 'c',
                content: $("#add-main"),
                success: function (layero, index) {
                    reset();
                },
                btn1: function () {
                    // alert("走这里了")
                    addJsonCfg(false, popupIndex);
                },
                btn2: function () {
                    reset();
                }
            });
        }

        function onModifyBtn() {
            //页面层-自定义
            layer.open({
                type: 1,
                title: "修改公共组件信息",
                closeBtn: true,
                shift: 2,
                area: ['400px', '420px'],
                shadeClose: true,
                btn: ['替换', '删除', '修改'],
                btnAlign: 'c',
                content: $("#modify-main"),
                end: function (layero, index) {
                    clearModifyInfo();
                },
                btn1: function () {
                    replaceJson();
                },
                btn2: function () {
                    delJson();
                    return false;
                },
                btn3: function () {
                    saveModifyJson();
                    return false;
                }
            });
        }

        $(document).ready(function () {
            initEvents();

            changeThemeColor();

            initFileCfgPath(CSLibrary.getSystemPath(SystemPath.EXTENSION));

            initThunbnails();


            layui.use(['element', 'layer', 'util'], function () {
                var element = layui.element;
                var layer = layui.layer;
                var util = layui.util;
                var $ = layui.$;

                //头部事件
                util.event('lay-header-event', {
                    menuLeft: function (othis) { // 左侧菜单事件
                        layer.msg('展开左侧菜单的操作', { icon: 0 });
                    },
                    menuRight: function () {  // 右侧菜单事件
                        layer.open({
                            type: 1,
                            title: '更多',
                            content: '<div style="padding: 15px;">处理右侧面板的操作</div>',
                            area: ['260px', '100%'],
                            offset: 'rt', // 右上角
                            anim: 'slideLeft', // 从右侧抽屉滑出
                            shadeClose: true,
                            scrollbar: false
                        });
                    }
                });
            });

            layui.use(function () {
                var element = layui.element;

                // hash 地址定位
                var hashName = 'tabid'; // hash 名称
                var layid = location.hash.replace(new RegExp('^#' + hashName + '='), ''); // 获取 lay-id 值

                // 初始切换
                element.tabChange('color-tab', layid);
                // 切换事件
                element.on('tab(color-tab)', function (obj) {
                    var type = this.getAttribute('lay-id')
                    if (type == 'light') {
                        setCurTabColor("#FFFFFF");
                    }
                    else {
                        setCurTabColor("#c2c2c2");
                    }
                });
            });

        });
    </script>
